name: 打包安卓 APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    # 钉死 22.04：buildozer / python-for-android 在这套环境上验证最充分。
    # ubuntu-latest 已切到 26.04，libtinfo5 等包被移除，且自带 Python 3.13
    # 会让 cython==0.29.33 编译失败。
    runs-on: ubuntu-22.04

    steps:
      - name: 拉代码
        uses: actions/checkout@v5

      - name: 装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 看一眼环境（出问题好定位）
        run: |
          echo "系统：$(lsb_release -d | cut -f2)"
          echo "Python：$(python3 --version)"
          echo "Java：$(java -version 2>&1 | head -1)"

      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache \
            libltdl-dev libtool-bin

      - name: 装 buildozer
        run: |
          mkdir -p /tmp/diag
          {
            echo "=== python 环境 ==="
            python3 -V
            command -v python3
            python3 -m pip --version || echo "[警告] python3 -m pip 不可用"
            echo "=== 升级 pip ==="
            python3 -m pip install --upgrade pip
            echo "=== 装 buildozer 1.6.0 ==="
            python3 -m pip install --no-cache-dir buildozer==1.6.0 cython==0.29.33 \
              || echo "[警告] 1.6.0 安装失败"
            echo "=== CLI 自检 ==="
            buildozer --version || echo "[警告] --version 没通过"
            echo "=== 已装列表 ==="
            python3 -m pip list 2>/dev/null | grep -iE 'buildozer|cython|pexpect|virtualenv'
          } > /tmp/diag/bz.txt 2>&1
          cat /tmp/diag/bz.txt
          # 1.6.0 的 CLI 自检不过就直接回退 1.5.0（Kivy 社区用得最广的那版）
          if ! buildozer --version >/dev/null 2>&1; then
            echo ">>> 1.6.0 自检不过，回退 1.5.0" | tee -a /tmp/diag/bz.txt
            python3 -m pip install --no-cache-dir buildozer==1.5.0 cython==0.29.33 2>&1 | tee -a /tmp/diag/bz.txt
            buildozer --version 2>&1 | tee -a /tmp/diag/bz.txt || exit 1
          fi

      - name: 缓存 SDK / NDK（首次构建后能省很多时间）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 构建 APK
        run: buildozer -v android debug

      # 构建一旦失败，把 buildozer 的现场日志留下来，否则只能靠猜
      - name: 失败时保留构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-diag
          path: |
            .buildozer/*.log
            .buildozer/android/platform/build-*/*.log
          if-no-files-found: ignore

      # Actions 日志没法从仓库外面读，失败时把现场输出推到一个临时分支上自查
      - name: 导出诊断（失败时）
        if: failure()
        run: |
          git checkout -B ci-diag
          cp /tmp/diag/bz.txt diag-bz.txt 2>/dev/null || true
          git add -f diag-bz.txt
          git -c user.name="ci-bot" -c user.email="ci-bot@users.noreply.github.com" \
            commit -m "CI 诊断输出（临时分支，可删）" || echo "没有可提交的诊断内容"
          git push -f origin ci-diag

      - name: 上传 APK（构建产物）
        uses: actions/upload-artifact@v4
        with:
          name: kanjianyue-debug
          path: bin/*.apk
          if-no-files-found: error

      # 发布到 Release：手机端能直接点 .apk 单文件下载，不用再下 zip 解压
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            看见余额 ${{ github.ref_name }}

            自动构建产物（debug 包，可直接安装）。

            注意：当前罐子与配色为实验版本，UI 待重做。
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
